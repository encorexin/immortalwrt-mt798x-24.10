name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择设备型号'
        required: true
        default: 'mt7981'
        type: choice
        options:
          - mt7981
          - mt7986

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: debian:11
      options: --privileged

    steps:
      - name: 设置环境变量
        run: |
          echo "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> $GITHUB_ENV
          echo "DEBIAN_FRONTEND=noninteractive" >> $GITHUB_ENV
          echo "TERM=xterm" >> $GITHUB_ENV
          
      - name: 安装依赖
        run: |
          apt-get update -y
          apt-get full-upgrade -y
          apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget sudo python3 python3-pip python3-setuptools python3-wheel ncurses-base

      - name: 创建非特权用户并设置工作目录权限
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          mkdir -p /home/builder/workspace
          chown builder:builder /home/builder/workspace
          
      - name: 切换到非特权用户并克隆源码
        run: |
          sudo -u builder bash -c '
            cd /home/builder/workspace
            git clone -b 2410 --single-branch --filter=blob:none https://github.com/padavanonly/immortalwrt-mt798x-24.10 immortalwrt-mt798x-24.10
            cd immortalwrt-mt798x-24.10
            ./scripts/feeds update -a
            ./scripts/feeds install -a
          '
          
      - name: 配置编译选项
        run: |
          cd /home/builder/workspace/immortalwrt-mt798x-24.10
          
          # 复制默认配置文件
          case "${{ github.event.inputs.device }}" in
            "mt7981")
              sudo -u builder cp -f defconfig/mt7981-ax3000.config .config
              ;;
            "mt7986")
              sudo -u builder cp -f defconfig/mt7986-ax6000.config .config
              ;;
          esac
          
          # 添加或修改指定的配置项
          sudo -u builder bash -c '
            cat >> .config << EOF
CONFIG_TARGET_mediatek=y
CONFIG_HAS_DEVICES=y
CONFIG_TARGET_BOARD="mediatek"
CONFIG_TARGET_SUBTARGET="mt7981"
CONFIG_TARGET_PROFILE="DEVICE_cmcc_rax3000m-emmc"
CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"
CONFIG_DEFAULT_TARGET_OPTIMIZATION="-Os -pipe -mcpu=cortex-a53"
CONFIG_CPU_TYPE="cortex-a53"
CONFIG_LINUX_5_4=y
CONFIG_DEFAULT_autocore-arm=y
CONFIG_DEFAULT_autoksmbd=y
CONFIG_DEFAULT_automount=y
CONFIG_DEFAULT_base-files=y
CONFIG_DEFAULT_blkid=y
CONFIG_DEFAULT_block-mount=y
CONFIG_DEFAULT_blockdev=y
CONFIG_DEFAULT_ca-bundle=y
CONFIG_DEFAULT_default-settings-chn=y
CONFIG_DEFAULT_dnsmasq-full=y
CONFIG_DEFAULT_dropbear=y
CONFIG_DEFAULT_f2fsck=y
EOF
          '
          
          # 修复递归依赖问题
          sudo -u builder sed -i '/PACKAGE_rd05a1/d' tmp/.config-package.in
          
          # 验证配置文件
          sudo -u builder make defconfig
          
      - name: 编译固件
        run: |
          cd /home/builder/workspace/immortalwrt-mt798x-24.10
          sudo -u builder make -j$(nproc) download V=s
          
          # 移除缺失的依赖警告
          sudo -u builder find package -name Makefile -exec sed -i '/prism54-firmware/d' {} \;
          sudo -u builder find package -name Makefile -exec sed -i '/rtl8192su-firmware/d' {} \;
          sudo -u builder find package -name Makefile -exec sed -i '/kmod-qrtr-smd/d' {} \;
          sudo -u builder find package -name Makefile -exec sed -i '/kmod-qrtr-mhi/d' {} \;
          
          # 编译固件
          sudo -u builder make -j$(nproc) V=s
          
      - name: 收集固件文件
        id: collect
        run: |
          cd /home/builder/workspace/immortalwrt-mt798x-24.10/bin/targets/*/*
          FILES=$(ls *.bin 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            mkdir -p /output
            cp $FILES /output/
            echo "固件文件已收集"
            echo "firmware_files=$(ls /output/ | tr '\n' ' ')" >> $GITHUB_ENV
          else
            echo "未找到固件文件"
            exit 1
          fi
          
      - name: 上传固件到 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ github.event.inputs.device }}-firmware
          path: /output/*
          retention-days: 7
